<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>学習ルーレット</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2330;--mu:#6b7385;--bd:#e3e6ee;--pri:#4f46e5;--pt:#fff;--A:#16a34a;--B:#2563eb;--C:#d97706;--D:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141b;--card:#1b1f2a;--tx:#e8ebf2;--mu:#9aa3b5;--bd:#2c3242;--pri:#818cf8;--pt:#10131a;--A:#4ade80;--B:#60a5fa;--C:#fbbf24;--D:#f87171}}
:root[data-theme="dark"]{--bg:#12141b;--card:#1b1f2a;--tx:#e8ebf2;--mu:#9aa3b5;--bd:#2c3242;--pri:#818cf8;--pt:#10131a;--A:#4ade80;--B:#60a5fa;--C:#fbbf24;--D:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;touch-action:pan-y pinch-zoom;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:12px 14px 40px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;padding:10px 8px;max-width:560px;margin:0 auto}
nav button{flex:1;min-width:0;padding:8px 0;font-size:10px;line-height:1.35}
nav button.on{background:var(--pri);color:var(--pt);border-color:var(--pri)}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:12px 14px}
button:disabled{opacity:.4}
.pri{background:var(--pri);color:var(--pt);border-color:var(--pri)}
.ghost{background:transparent;color:var(--mu)}
.big{width:100%;font-size:18px;font-weight:700;padding:16px;margin-top:12px;background:var(--pri);color:var(--pt);border-color:var(--pri)}
.w{width:100%;margin-top:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.c{justify-content:center;text-align:center}
.mu{color:var(--mu);font-size:13px}
.bar{height:8px;background:var(--bd);border-radius:9px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri)}
.slots{display:grid;gap:8px;margin:14px 0}
.slot{height:56px;display:grid;place-items:center;font-size:22px;font-weight:800;background:var(--card);border:2px solid var(--bd);border-radius:14px}
.slot.spin{border-color:var(--pri);animation:p .15s infinite alternate}
@keyframes p{to{transform:translateY(-4px)}}
.timer{font-size:48px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin-bottom:8px}
.timer+.row button{flex:1}
.prob{display:flex;align-items:center;gap:12px;padding:8px 12px;margin-bottom:8px}
.prob .g{padding:5px 0;font-size:18px;border-radius:10px}
.num{font-size:19px;font-weight:800;min-width:112px;line-height:1.3}
.num small{font-size:13px;color:var(--mu);margin-left:2px}
.rt{display:flex;gap:6px;flex:1}
.g{flex:1;font-size:20px;font-weight:800;padding:10px 0;border:2px solid var(--c);background:transparent;color:var(--c)}
.g.on{background:var(--c);color:var(--pt)}
.gA,.cA{--c:var(--A)}.gB,.cB{--c:var(--B)}.gC,.cC{--c:var(--C)}.gD,.cD{--c:var(--D)}
.chip{display:inline-block;padding:4px 11px;margin:3px;border-radius:999px;border:1.5px solid var(--c);color:var(--c);font-weight:700}
.gh{border-left:6px solid var(--c)}
label{font-weight:700;display:block;margin-bottom:6px}
textarea,input{width:100%;font:inherit;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
h3{margin:18px 2px 8px;font-size:15px}
.cm{white-space:pre-wrap;margin-top:6px;padding:8px 10px;background:var(--bg);border-radius:10px;font-size:14px}
.chip[data-id]{touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.gh.drop{outline:2px dashed var(--c);outline-offset:2px}
.gh.over{outline-style:solid;background:var(--bg)}
.dgc{position:fixed;z-index:99;pointer-events:none;margin:0;background:var(--card);box-shadow:0 8px 22px rgba(0,0,0,.4);transform:scale(1.2)}
.rec{display:grid;grid-template-columns:40% 1fr;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;overflow:hidden}
.rl{padding:9px 10px;border-right:1px solid var(--bd);font-size:13px;line-height:1.4}
.rl .mu{font-size:12px}
.rl .chip{font-size:12px;padding:1px 8px;margin:2px 2px 0 0}
.rr{padding:9px 10px;display:flex;flex-direction:column}
.rc{flex:1;white-space:pre-wrap;word-break:break-word;font-size:14px}
.ra{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;margin-top:6px}
.dl,.fx{padding:2px 8px;font-size:12px;border-radius:8px;background:transparent;color:var(--mu)}
.dl{margin-left:auto}
.fx{font-weight:700;color:var(--C);border-color:var(--C)}
.fx.ok{background:var(--A);border-color:var(--A);color:var(--pt)}
.dl.arm{color:var(--D);border-color:var(--D)}
@keyframes sl{from{opacity:.2;transform:translateX(var(--sx,0))}to{opacity:1;transform:none}}
</style>
</head>
<body>
<nav id="nav">
  <button data-tab="roulette">🎯<br>ルーレット</button>
  <button data-tab="rev">📚<br>復習</button>
  <button data-tab="one">🔍<br>個別</button>
  <button data-tab="class">📊<br>分類</button>
  <button data-tab="log">📖<br>記録</button>
  <button data-tab="set">⚙<br>設定</button>
</nav>
<main id="app"></main>
<script>
const K='studylog_v2',DP=[19,6,5,36,14,32,50,38,37,53,54,36];
const D0=()=>({parts:DP.slice(),used:[],rated:{},log:[],act:null});
let S=D0(),tab='roulette',spinning=false,undoArm=false,delArm=null,sId=0,sC='',sR='',sMsg='',sIn=['',''];
try{const j=localStorage.getItem(K);if(j)S=Object.assign(S,JSON.parse(j))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pool=()=>{const u=new Set(S.used),a=[];S.parts.forEach((c,i)=>{for(let q=1;q<=c;q++){const id=(i+1)*1000+q;if(!u.has(id))a.push(id)}});return a};
const total=()=>S.parts.reduce((t,c)=>t+c,0);
const lab=id=>`第${Math.floor(id/1000)}部 ${id%1000}問目`,sh=id=>Math.floor(id/1000)+'-'+id%1000;
const fmt=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const el=()=>S.act?S.act.ms+(S.act.t0?Date.now()-S.act.t0:0):0;
const cdList=()=>Object.keys(S.rated).map(Number).filter(n=>S.rated[n]==='C'||S.rated[n]==='D').sort((x,y)=>x-y);
const chip=(n,g,d)=>`<span class="chip c${g}"${d?` data-id="${n}"`:''}>${sh(n)}${g?' '+g:''}</span>`;

function setupForm(t){
  return `<div class="card"><label>${t}</label><input id="tot" value="${S.parts.join(',')}"><p class="mu">第1部から順に、各部の問題数をカンマ区切りで入力（現在 ${S.parts.length}部・計${total()}問）</p><button id="stot" class="pri w">保存</button><p class="mu" id="smsg"></p></div>`;
}
function vRoulette(){
  const p=pool(),T=total(),done=T-p.length;
  let h=`<div class="card"><div class="row"><span>未修 <b>${p.length}</b> / ${T} 問</span><span class="mu">${Math.round(done/T*100)}% 完了</span></div><div class="bar"><i style="width:${done/T*100}%"></i></div></div>`;
  if(S.act)return h+(S.act.rv?'<div class="card c mu">📚 復習中です。「復習」タブで続けてください</div>':vSession());
  h+=`<div class="slots">${'<div class="slot">?</div>'.repeat(5)}</div><button class="big" id="spin" ${p.length?'':'disabled'}>🎯 ルーレットを回す</button>`;
  if(!p.length)h+='<p class="c mu">全問題を一巡しました 🎉</p>';
  return h;
}
function vRev(){
  if(S.act)return S.act.rv?vSession():'<div class="card c mu">🎯 ルーレット中です。完了してから復習できます</div>';
  const cd=cdList(),nd=cd.filter(n=>S.rated[n]==='D').length;
  return `<div class="card"><label>📚 復習</label><p class="mu">C・D評価の問題からランダムに5問を出題します（現在 D: ${nd}問 ／ C: ${cd.length-nd}問）。評価を付け直すと分類が更新されます。</p></div><div class="slots">${'<div class="slot">?</div>'.repeat(5)}</div><button class="big" id="rv" ${cd.length?'':'disabled'}>📚 復習ルーレットを回す</button>${cd.length?'':'<p class="c mu">C・Dの問題がまだありません</p>'}`;
}
function vSession(){
  const a=S.act;
  let h=(a.rv?'<p class="mu c">📚 復習セッション（C・D評価の問題から出題）</p>':'')+`<div class="card"><div class="timer" id="tm">${fmt(el())}</div><div class="row"><button id="tgo" class="${a.t0?'':'pri'}">${a.t0?'⏸ 一時停止':'▶ 開始'}</button><button id="trs" class="ghost">リセット</button></div></div>`;
  a.nums.forEach(n=>{h+=`<div class="card prob"><div class="num">${lab(n)}${a.rv?`<br><small>現在の評価 ${S.rated[n]}</small>`:''}</div><div class="rt">${['A','B','C','D'].map(g=>`<button class="g g${g} ${a.r[n]===g?'on':''}" data-n="${n}" data-g="${g}">${g}</button>`).join('')}</div></div>`});
  h+=`<div class="card"><label>📝 反省コメント</label><textarea id="cm" rows="4" placeholder="できなかった理由、次に気をつけること…">${esc(a.comment)}</textarea></div><p id="msg" class="mu c">${a.rv?'評価をつけなかった問題は、元の評価のままです':'評価をつけなかった問題は、記録されず未修に戻ります'}</p><button class="big" id="fin">✅ 完了して記録する</button><button class="ghost w" id="undo">${undoArm?(a.rv?'もう一度押すとやめます':'もう一度押すと未修に戻します'):(a.rv?'やめる（復習を中止）':'やり直し（この問題を未修に戻す）')}</button>`;
  return h;
}
function vClass(){
  const g={A:[],B:[],C:[],D:[]};
  Object.keys(S.rated).forEach(n=>g[S.rated[n]]&&g[S.rated[n]].push(+n));
  const names={D:'要復習',C:'もう少し',B:'まあまあ',A:'完璧'};
  let h=`<p class="mu">未修: ${pool().length}問 ／ 表記は「部-問」（例: 8-15 = 第8部の15問目）<br>💡 番号を長押ししてドラッグすると、別の評価へ移せます</p>`;
  ['D','C','B','A'].forEach(k=>{
    g[k].sort((x,y)=>x-y);
    h+=`<div class="card gh c${k}" data-g="${k}"><div class="row"><b style="color:var(--c);font-size:18px">${k} <span style="font-size:13px">${names[k]}</span></b><span class="mu">${g[k].length}問</span></div><div>${g[k].length?g[k].map(n=>chip(n,'',1)).join(''):'<span class="mu">なし</span>'}</div></div>`;
  });
  return h;
}
function vLog(){
  if(!S.log.length)return '<p class="mu c">まだ記録がありません。ルーレットを回して解いてみよう！</p>';
  const days={},order=[];
  [...S.log].reverse().forEach(s=>{
    const k=new Date(s.ts).toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
    if(!days[k]){days[k]=[];order.push(k)}
    days[k].push(s);
  });
  return '<p class="mu">表記は「部-問」（例: 8-15 = 第8部の15問目）</p>'+order.map(k=>{
    const L=days[k],ms=L.reduce((t,s)=>t+s.ms,0),cnt=L.reduce((t,s)=>t+(s.mv?0:s.nums.length),0);
    return `<h3 class="row"><span>${k}</span><span class="mu">${cnt}問 / ${fmt(ms)}</span></h3>`+L.map((s,i)=>{
      const tm=new Date(s.ts).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
      const ar=delArm===s.ts,ty=s.mv?'分類変更':s.one?'個別追加':s.rv?'📚復習 ⏱'+fmt(s.ms):'🎯 ⏱'+fmt(s.ms);
      const fx=s.c&&!s.mv?`<button class="fx${s.fx?' ok':''}" data-fx="${s.ts}">${s.fx?'✅ 対策済み':'⚠ 未対策'}</button>`:'';
      return `<div class="rec"><div class="rl"><div><b>${L.length-i}回目</b> <span class="mu">${tm}</span></div><div class="mu">${ty}</div><div>${s.nums.map(n=>chip(n,s.r[n])).join('')}</div></div><div class="rr"><div class="rc${s.c?'':' mu'}">${s.c?esc(s.c):'（反省なし）'}</div><div class="ra">${fx}<button class="dl${ar?' arm':''}" data-del="${s.ts}">${ar?'もう一度タップで削除（未修に戻ります）':'🗑'}</button></div></div></div>`;
    }).join('');
  }).join('');
}
function vSet(){
  return setupForm('各部の問題数')+`<div class="card"><label>💾 バックアップ</label><p class="mu">記録はこの端末のブラウザに保存されます。機種変更やデータ削除に備えて、コピーして保管しておくと安心です。</p><textarea id="bk" rows="3" placeholder="復元するときはここにバックアップを貼り付け"></textarea><div class="row" style="margin-top:8px"><button id="bcp" class="w" style="margin:0">コピー</button><button id="brs" class="w" style="margin:0">復元</button></div><p class="mu" id="bmsg"></p></div>`;
}
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  $('#app').innerHTML={roulette:vRoulette,rev:vRev,one:vOne,class:vClass,log:vLog,set:vSet}[tab]();
}
function spin(rv){
  const p=rv?cdList():pool();if(!p.length||spinning)return;
  spinning=true;$(rv?'#rv':'#spin').disabled=true;
  const q=p.slice(),pick=[];
  for(let i=0;i<Math.min(5,p.length);i++)pick.push(q.splice(Math.floor(Math.random()*q.length),1)[0]);
  pick.sort((x,y)=>x-y);
  const sl=document.querySelectorAll('.slot');
  sl.forEach(s=>s.classList.add('spin'));
  const iv=setInterval(()=>sl.forEach(s=>s.textContent=lab(p[Math.floor(Math.random()*p.length)])),70);
  setTimeout(()=>{
    clearInterval(iv);
    sl.forEach((s,i)=>{s.classList.remove('spin');s.textContent=pick[i]!==undefined?lab(pick[i]):'–'});
    setTimeout(()=>{if(!rv)S.used.push(...pick);S.act={nums:pick,r:{},comment:'',ms:0,t0:null,rv:rv?1:0};save();spinning=false;undoArm=false;render()},900);
  },1400);
}
function delRec(ts){
  const i=S.log.findIndex(x=>x.ts===ts);if(i<0)return;
  const e=S.log.splice(i,1)[0];
  const keep=new Set(S.act?S.act.nums:[]);S.log.forEach(x=>x.nums.forEach(n=>keep.add(n)));
  S.used=S.used.filter(n=>!e.nums.includes(n)||keep.has(n));
  S.rated={};S.log.forEach(x=>x.nums.forEach(n=>S.rated[n]=x.r[n]));
  save();render();
}
function vOne(){
  const inA=S.act?S.act.nums.includes(sId):false;
  let h=`<div class="card"><label>🔍 問題を検索</label><div class="row"><span>第</span><input id="ip" type="number" inputmode="numeric" placeholder="部" style="min-width:0" value="${sIn[0]}"><span>部</span><input id="iq" type="number" inputmode="numeric" placeholder="番号" style="min-width:0" value="${sIn[1]}"><span>問目</span></div><button id="sch" class="pri w">検索</button></div>`;
  if(sId){
    const g=S.rated[sId],used=S.used.includes(sId),n=S.log.filter(x=>x.nums.includes(sId)).length,ar=delArm==='p'+sId;
    h+=`<div class="card"><div class="row"><b style="font-size:20px">${lab(sId)}</b><span class="mu">${inA?'ルーレット中':g?'現在の評価 '+g:'未修'}</span></div>`;
    if(inA)h+='<p class="mu">この問題は今のルーレットに入っています。ルーレット画面で評価してください。</p>';
    else{
      h+=`<div class="rt" style="margin:12px 0">${['A','B','C','D'].map(k=>`<button class="g g${k} ${sR===k?'on':''}" data-sg="${k}">${k}</button>`).join('')}</div><textarea id="scm" rows="3" placeholder="📝 反省コメント（任意）">${esc(sC)}</textarea><button class="big" id="srec">✅ 記録する</button><p class="mu c">評価を選び、反省を書いてから「記録する」を押してください。評価の付け直しもできます。</p>`;
      if(used)h+=`<button class="ghost w" data-sd="1"${ar?' style="color:var(--D);border-color:var(--D)"':''}>${ar?'もう一度押すと削除（未修に戻ります）':'🗑 この問題の記録をすべて消して未修に戻す（'+n+'件）'}</button>`;
    }
    h+='</div>';
  }
  return h+`<p class="mu c">${esc(sMsg)}</p>`;
}
function schOne(){
  const a=$('#ip').value,b=$('#iq').value,p=parseInt(a,10),q=parseInt(b,10);
  sIn=[a,b];sC='';sR='';
  if(!(p>=1&&p<=S.parts.length)){sId=0;sMsg='部は1〜'+S.parts.length+'で入力してください';return render()}
  if(!(q>=1&&q<=S.parts[p-1])){sId=0;sMsg='第'+p+'部は1〜'+S.parts[p-1]+'問です';return render()}
  sId=p*1000+q;sMsg='';render();
}
function recOne(id,g){
  S.log.push({ts:Date.now(),nums:[id],r:{[id]:g},ms:0,one:1,c:sC.trim()});
  if(!S.used.includes(id))S.used.push(id);
  S.rated[id]=g;sMsg=lab(id)+' を '+g+' で記録しました（記録ページに追加）';sC='';sR='';sId=0;sIn=['',''];save();render();window.scrollTo(0,0);
}
function delOne(id){
  S.log.forEach(x=>{if(x.nums.includes(id)){x.nums=x.nums.filter(n=>n!==id);delete x.r[id]}});
  S.log=S.log.filter(x=>x.nums.length);
  S.used=S.used.filter(n=>n!==id);
  S.rated={};S.log.forEach(x=>x.nums.forEach(n=>S.rated[n]=x.r[n]));
  sMsg=lab(id)+' を未修に戻しました';save();render();
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='ip'||e.target.id==='iq'))schOne()});
function say(id,t){const e=$(id);if(e)e.textContent=t}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.tab)});
$('#app').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const id=b.id,a=S.act;
  if(b.dataset.del){const ts=+b.dataset.del;if(delArm!==ts){delArm=ts;render();return}delArm=null;delRec(ts);return}
  if(b.dataset.sd){const k='p'+sId;if(delArm!==k){delArm=k;render();return}delArm=null;delOne(sId);return}
  if(b.dataset.sg){sR=b.dataset.sg;sMsg='';const t=$('#scm');if(t)sC=t.value;render();return}
  if(id==='srec'){const t=$('#scm');if(t)sC=t.value;if(!sR){sMsg='A〜Dの評価を選んでください';render();return}recOne(sId,sR);return}
  delArm=null;
  if(b.dataset.fx){const r=S.log.find(x=>x.ts===+b.dataset.fx);if(r){r.fx=r.fx?0:1;save()}render();return}
  if(id==='sch')return schOne();
  if(id==='spin')spin();
  else if(id==='rv')spin(1);
  else if(b.dataset.g){a.r[b.dataset.n]=b.dataset.g;save();render()}
  else if(id==='tgo'){if(a.t0){a.ms+=Date.now()-a.t0;a.t0=null}else a.t0=Date.now();save();render()}
  else if(id==='trs'){a.ms=0;a.t0=null;save();render()}
  else if(id==='fin'){
    const cmE=$('#cm');if(cmE)a.comment=cmE.value;
    const dn=a.nums.filter(n=>a.r[n]),rest=a.nums.filter(n=>!a.r[n]);
    if(!dn.length)return say('#msg','1問以上、A〜Dの評価をつけてください');
    const ms=el();
    S.log.push({ts:Date.now(),nums:dn,r:a.r,ms:ms,c:a.comment.trim(),rv:a.rv});
    dn.forEach(n=>S.rated[n]=a.r[n]);if(!a.rv)S.used=S.used.filter(n=>!rest.includes(n));
    S.act=null;save();go('log');
  }
  else if(id==='undo'){
    if(!undoArm){undoArm=true;render();return}
    if(!a.rv){const u=new Set(a.nums);S.used=S.used.filter(n=>!u.has(n))}S.act=null;undoArm=false;save();render();
  }
  else if(id==='stot'){
    const P=$('#tot').value.split(/[,、，\s]+/).filter(x=>x).map(x=>parseInt(x,10));
    if(!P.length||P.some(x=>!(x>=1)))return say('#smsg','1以上の数をカンマ区切りで入力してください');
    S.parts=P;save();render();
  }
  else if(id==='bcp'){
    const t=$('#bk');t.value=JSON.stringify(S);t.select();
    try{navigator.clipboard.writeText(t.value).then(()=>say('#bmsg','コピーしました'),()=>say('#bmsg','選択状態です。手動でコピーしてください'))}catch(x){say('#bmsg','選択状態です。手動でコピーしてください')}
  }
  else if(id==='brs'){
    try{const d=JSON.parse($('#bk').value);if(!d||!Array.isArray(d.log)||!Array.isArray(d.used)||!Array.isArray(d.parts))throw 0;S=Object.assign(D0(),d);save();say('#bmsg','復元しました');setTimeout(render,700)}
    catch(x){say('#bmsg','復元できませんでした。バックアップ全体を貼り付けてください')}
  }
});
document.addEventListener('input',e=>{if(e.target.id==='scm')sC=e.target.value;if(e.target.id==='cm'&&S.act){S.act.comment=e.target.value;save()}});
let dg=null;
const pt=e=>e.touches?(e.touches[0]||e.changedTouches[0]):e;
const tgtAt=(x,y)=>{const e=document.elementFromPoint(x,y);return e&&e.closest('.gh')};
const clr=()=>document.querySelectorAll('.gh').forEach(x=>x.classList.remove('drop','over'));
function dStart(e){
  const c=e.target.closest('[data-id]');if(!c)return;
  const p=pt(e);dg={id:+c.dataset.id,from:c.closest('.gh').dataset.g,c:c,x:p.clientX,y:p.clientY,on:0};
  dg.tm=setTimeout(dBegin,e.touches?350:150);
}
function dBegin(){
  const c=dg.c,r=c.getBoundingClientRect(),cs=getComputedStyle(c),g=c.cloneNode(true);
  g.classList.add('dgc');g.removeAttribute('data-id');
  g.style.cssText=`left:${r.left}px;top:${r.top}px;color:${cs.color};border-color:${cs.color}`;
  document.body.appendChild(g);c.style.opacity='.3';
  dg.g=g;dg.dx=dg.x-r.left;dg.dy=dg.y-r.top;dg.on=1;swBlock=true;
  document.querySelectorAll('.gh').forEach(x=>x.classList.add('drop'));
  if(navigator.vibrate)navigator.vibrate(15);
}
function dMove(e){
  if(!dg)return;const p=pt(e);
  if(!dg.on){if(Math.hypot(p.clientX-dg.x,p.clientY-dg.y)>10){clearTimeout(dg.tm);dg=null}return}
  e.preventDefault();
  dg.g.style.left=(p.clientX-dg.dx)+'px';dg.g.style.top=(p.clientY-dg.dy)+'px';
  const t=tgtAt(p.clientX,p.clientY);
  document.querySelectorAll('.gh').forEach(x=>x.classList.toggle('over',x===t));
}
function dEnd(e){
  if(!dg)return;clearTimeout(dg.tm);
  if(!dg.on){dg=null;return}
  const p=pt(e),t=tgtAt(p.clientX,p.clientY),to=t&&t.dataset.g,d=dg;
  d.g.remove();d.c.style.opacity='';clr();dg=null;
  if(to&&to!==d.from){
    S.log.push({ts:Date.now(),nums:[d.id],r:{[d.id]:to},ms:0,mv:1,c:'分類を '+d.from+'→'+to+' に変更'});
    S.rated[d.id]=to;save();
  }
  render();
}
function dCancel(){
  if(!dg)return;clearTimeout(dg.tm);
  if(dg.g){dg.g.remove();dg.c.style.opacity=''}
  clr();dg=null;
}
$('#app').addEventListener('touchstart',dStart,{passive:true});
$('#app').addEventListener('mousedown',dStart);
$('#app').addEventListener('contextmenu',e=>{if(e.target.closest('[data-id]'))e.preventDefault()});
document.addEventListener('touchmove',dMove,{passive:false});
document.addEventListener('mousemove',dMove);
document.addEventListener('touchend',dEnd);
document.addEventListener('mouseup',dEnd);
document.addEventListener('touchcancel',dCancel);
const TABS=['roulette','rev','one','class','log','set'];
function go(t){
  const o=TABS.indexOf(tab),n=TABS.indexOf(t);
  tab=t;delArm=null;render();window.scrollTo(0,0);
  const a=$('#app');a.style.setProperty('--sx',(n>o?40:-40)+'px');a.style.animation='none';a.offsetWidth;a.style.animation='sl .22s ease-out';
}
let sw=null,swBlock=false;
document.addEventListener('touchstart',e=>{
  swBlock=false;const p=e.touches[0];
  sw=(e.touches.length===1&&!e.target.closest('input,textarea'))?{x:p.clientX,y:p.clientY}:null;
},{passive:true});
document.addEventListener('touchend',e=>{
  if(!sw||swBlock||spinning){sw=null;return}
  const p=e.changedTouches[0],dx=p.clientX-sw.x,dy=p.clientY-sw.y;sw=null;
  if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.6)return;
  const i=TABS.indexOf(tab)+(dx<0?1:-1);
  if(i>=0&&i<TABS.length)go(TABS[i]);
},{passive:true});
setInterval(()=>{const t=$('#tm');if(t&&S.act)t.textContent=fmt(el())},500);
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
