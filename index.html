<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<title>学習ルーレット</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2330;--mu:#6b7385;--bd:#e3e6ee;--pri:#4f46e5;--pt:#fff;--A:#16a34a;--B:#2563eb;--C:#d97706;--D:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141b;--card:#1b1f2a;--tx:#e8ebf2;--mu:#9aa3b5;--bd:#2c3242;--pri:#818cf8;--pt:#10131a;--A:#4ade80;--B:#60a5fa;--C:#fbbf24;--D:#f87171}}
:root[data-theme="dark"]{--bg:#12141b;--card:#1b1f2a;--tx:#e8ebf2;--mu:#9aa3b5;--bd:#2c3242;--pri:#818cf8;--pt:#10131a;--A:#4ade80;--B:#60a5fa;--C:#fbbf24;--D:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;touch-action:pan-y pinch-zoom;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:12px 14px 40px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:10px 14px;max-width:560px;margin:0 auto}
#mn{width:46px;height:46px;padding:0;font-size:22px;line-height:1;border-radius:14px}
#ttl{font-size:20px;font-weight:800}
#drw{position:fixed;inset:0;z-index:180;background:rgba(0,0,0,.5);opacity:0;transition:opacity .18s}
#drw[hidden]{display:none}
#drw.show{opacity:1}
.dp{position:absolute;left:0;top:0;bottom:0;width:min(78vw,300px);background:var(--card);border-right:1px solid var(--bd);padding:calc(env(safe-area-inset-top,0px) + 14px) 12px 14px;transform:translateX(-100%);transition:transform .22s;overflow-y:auto}
#drw.show .dp{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;margin:0 4px 12px;font-size:17px}
.dh button{padding:4px 12px}
.dp button[data-tab]{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font-size:16px;font-weight:600;padding:14px;margin-bottom:6px;border:none;background:transparent}
.dp button[data-tab] span{font-size:20px;width:26px;text-align:center}
.dp button[data-tab].on{background:var(--pri);color:var(--pt)}
.mg{display:flex;gap:10px;align-items:flex-start}
.mc{flex:1;min-width:0}
.nc{display:block;width:100%;text-align:left;padding:14px;margin-bottom:10px;border-radius:18px;background:var(--card);border:1px solid var(--bd)}
.nt1{font-weight:800;font-size:17px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.nb{color:var(--mu);font-size:14px;margin-top:8px;white-space:pre-wrap;word-break:break-word;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.nd{color:var(--mu);font-size:12px;margin-top:10px}
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:60px;height:60px;border-radius:50%;padding:0;font-size:30px;line-height:1;background:var(--pri);color:var(--pt);border:none;box-shadow:0 6px 18px rgba(0,0,0,.4);z-index:60}
#ndl{position:fixed;inset:0;z-index:150;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#ndl[hidden]{display:none}
.nh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--bd)}
#nt{flex:1;width:100%;border:none;border-radius:0;background:transparent;font-size:17px;line-height:1.6;padding:14px;resize:none;outline:none}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:12px 14px}
button:disabled{opacity:.4}
.pri{background:var(--pri);color:var(--pt);border-color:var(--pri)}
.ghost{background:transparent;color:var(--mu)}
.big{width:100%;font-size:18px;font-weight:700;padding:16px;margin-top:12px;background:var(--pri);color:var(--pt);border-color:var(--pri)}
.w{width:100%;margin-top:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.c{justify-content:center;text-align:center}
.mu{color:var(--mu);font-size:13px}
.bar{height:8px;background:var(--bd);border-radius:9px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri)}
.slots{display:grid;gap:8px;margin:14px 0}
.slot{height:56px;display:grid;place-items:center;font-size:22px;font-weight:800;background:var(--card);border:2px solid var(--bd);border-radius:14px}
.slot.spin{border-color:var(--pri);animation:p .15s infinite alternate}
@keyframes p{to{transform:translateY(-4px)}}
.timer{font-size:48px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin-bottom:8px}
.timer+.row button{flex:1}
.prob{display:flex;align-items:center;gap:12px;padding:8px 12px;margin-bottom:8px}
.prob .g{padding:5px 0;font-size:18px;border-radius:10px}
.num{font-size:19px;font-weight:800;min-width:112px;line-height:1.3}
.num small{font-size:13px;color:var(--mu);margin-left:2px}
.rt{display:flex;gap:6px;flex:1}
.g{flex:1;font-size:20px;font-weight:800;padding:10px 0;border:2px solid var(--c);background:transparent;color:var(--c)}
.g.on{background:var(--c);color:var(--pt)}
.gA,.cA{--c:var(--A)}.gB,.cB{--c:var(--B)}.gC,.cC{--c:var(--C)}.gD,.cD{--c:var(--D)}
.chip{display:inline-block;padding:4px 11px;margin:3px;border-radius:999px;border:1.5px solid var(--c);color:var(--c);font-weight:700}
.gh{border-left:6px solid var(--c)}
label{font-weight:700;display:block;margin-bottom:6px}
textarea,input,select{width:100%;font:inherit;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
h3{margin:18px 2px 8px;font-size:15px}
.cm{white-space:pre-wrap;margin-top:6px;padding:8px 10px;background:var(--bg);border-radius:10px;font-size:14px}
.chip[data-id]{touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.gh.drop{outline:2px dashed var(--c);outline-offset:2px}
.gh.over{outline-style:solid;background:var(--bg)}
.dgc{position:fixed;z-index:99;pointer-events:none;margin:0;background:var(--card);box-shadow:0 8px 22px rgba(0,0,0,.4);transform:scale(1.2)}
.rec{display:grid;grid-template-columns:40% 1fr;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;overflow:hidden}
.rl{padding:9px 10px;border-right:1px solid var(--bd);font-size:13px;line-height:1.4}
.rl .mu{font-size:12px}
.rl .chip{font-size:12px;padding:1px 8px;margin:2px 2px 0 0}
.rr{padding:9px 10px;display:flex;flex-direction:column}
.rc{flex:1;white-space:pre-wrap;word-break:break-word;font-size:14px}
.ra{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;margin-top:6px}
.dl,.fx{padding:2px 8px;font-size:12px;border-radius:8px;background:transparent;color:var(--mu)}
.dl{margin-left:auto}
.fx{font-weight:700;color:var(--C);border-color:var(--C)}
.fx.ok{background:var(--A);border-color:var(--A);color:var(--pt)}
.dl.arm{color:var(--D);border-color:var(--D)}
.lf{font-weight:700;color:var(--C);border-color:var(--C);background:transparent;padding:8px 16px;border-radius:999px;font-size:14px}
.lf.on{background:var(--C);color:var(--pt)}
#one{margin-top:22px;scroll-margin-top:72px}
.bks{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 14px}
.bk{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px}
.bk.on{background:var(--pri);color:var(--pt);border-color:var(--pri)}
.cdp{min-height:120px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;text-align:right;word-break:break-all}
.cx{font-size:32px;font-weight:800;line-height:1.25;font-variant-numeric:tabular-nums}
.cr{font-size:18px;color:var(--mu);min-height:26px;margin-top:4px;font-variant-numeric:tabular-nums}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kp button{padding:0;height:58px;font-size:22px;font-weight:700;border-radius:14px;user-select:none;-webkit-user-select:none}
.kp .op{color:var(--pri);border-color:var(--pri)}
.kp .ac{color:var(--D);border-color:var(--D)}
.kp .eq{grid-column:1/-1;background:var(--pri);color:var(--pt);border-color:var(--pri)}
.tb{align-self:stretch;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px;text-align:left}
.hb{padding:3px 11px;font-size:13px;font-weight:700;border-radius:999px;color:var(--pri);border-color:var(--pri);background:transparent}
.tcard{position:relative}
.tsp{position:absolute;right:12px;top:12px;margin:0}
.ais{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;margin-left:auto}
.ais a{padding:3px 9px;font-size:12px;font-weight:700;line-height:1.4;border-radius:999px;border:1px solid var(--bd);color:var(--mu);text-decoration:none;background:transparent}
.ais a:active{background:var(--bd)}
.hl{max-height:50vh;overflow-y:auto;margin-bottom:6px}
.hi{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;margin-bottom:6px;padding:10px 12px;text-align:left}
.hx{color:var(--mu);font-size:13px;word-break:break-all}
.hv{font-weight:800;white-space:nowrap}
details.card>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"▸";color:var(--mu);margin-left:4px}
details.card[open]>summary::after{content:"▾"}
details.card[open]>summary{margin-bottom:10px}
.sn{margin-left:auto;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translate(-50%,12px);max-width:86%;background:var(--pri);color:var(--pt);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes pop{0%{transform:scale(.8)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
.bk.pop{animation:pop .38s ease-out}
#mdl,#hdl,#rdl,#gdl{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12vh) 20px 20px;opacity:0;transition:opacity .18s}
#mdl[hidden],#hdl[hidden],#rdl[hidden],#gdl[hidden]{display:none}
#mdl.show,#hdl.show,#rdl.show,#gdl.show{opacity:1}
.mbox{width:100%;max-width:420px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.45);transform:translateY(14px) scale(.96);transition:transform .2s}
#mdl.show .mbox,#hdl.show .mbox,#rdl.show .mbox,#gdl.show .mbox{transform:none}
#gdl{align-items:center;padding-top:20px}
.gitem{padding:12px 0}
.gitem+.gitem{border-top:1px solid var(--bd)}
.gname{font-weight:700;font-size:18px}
.gsub{color:var(--mu);font-size:14px;margin-top:2px}
.gbig{font-size:30px;font-weight:800;line-height:1.3;margin-top:4px}
.gbig b{font-size:68px;font-variant-numeric:tabular-nums}
.gbar{height:5px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:12px}
.gbar i{display:block;height:100%;width:100%;background:var(--pri)}
@keyframes gb{from{width:100%}to{width:0}}
#rdl .mbox{max-height:80vh;overflow-y:auto}
.rg{padding:2px 10px;font-size:16px;border-radius:999px;background:transparent;color:var(--mu)}
.rg.on{background:var(--pri);border-color:var(--pri);color:var(--pt)}
.sq{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.sqb{aspect-ratio:1;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--mu);font-size:22px;font-weight:800;line-height:1.1}
.sqb small{display:block;font-size:11px;font-weight:600}
.sqb.on{background:var(--pri);border-color:var(--pri);color:var(--pt)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:17px}
.mh button{padding:4px 12px}
details.pf>summary{cursor:pointer;font-weight:700}
.pbig{font-size:34px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.pbig small{font-size:15px;font-weight:700;margin:0 2px}
.pl.old{opacity:.55}
@keyframes sl{from{opacity:.2;transform:translateX(var(--sx,0))}to{opacity:1;transform:none}}
.rwdetail{margin:12px 0 14px;border-top:1px solid var(--bd);padding-top:12px}
.rwdetail>summary{cursor:pointer;font-weight:700}
.rw{display:grid;grid-template-columns:3.6em minmax(0,1fr) 2.2em;align-items:center;column-gap:8px;padding:4px 0;border-top:1px solid var(--bd)}
.rw label{margin:0;white-space:nowrap}
.rw output{text-align:right;color:var(--pri);font-weight:800;font-variant-numeric:tabular-nums}
.rw input[type="range"]{display:block;min-width:0;width:100%;height:36px;margin:0;padding:0;border:0;background:transparent;accent-color:var(--pri)}
.rw input:disabled{opacity:.4}
.rw .rwinfo{grid-column:1/-1;margin:0;color:var(--mu);font-size:12px;line-height:1.4}
</style>
</head>
<body>
<nav id="nav"><button id="mn" aria-label="メニュー">☰</button><b id="ttl"></b></nav>
<main id="app"></main>
<div id="toast"></div>
<div id="drw" hidden>
  <div class="dp" role="dialog" aria-modal="true" aria-label="メニュー">
    <div class="dh"><b>メニュー</b><button id="dx" class="ghost" aria-label="閉じる">✕</button></div>
    <button data-tab="roulette"><span>🎯</span>ルーレット</button>
    <button data-tab="rev"><span>📚</span>復習</button>
    <button data-tab="calc"><span>🧮</span>電卓</button>
    <button data-tab="class"><span>📊</span>分類</button>
    <button data-tab="log"><span>📖</span>記録</button>
    <button data-tab="plan"><span>📅</span>予定表</button>
    <button data-tab="memo"><span>📝</span>メモ</button>
    <button data-tab="set"><span>⚙</span>設定</button>
  </div>
</div>
<div id="ndl" hidden>
  <div class="nh"><button id="nb" class="ghost">← 戻る</button><span class="mu" id="nd"></span><button id="ndel" class="ghost">🗑</button></div>
  <textarea id="nt" placeholder="メモを入力（1行目がタイトルになります）"></textarea>
</div>
<div id="mdl" hidden>
  <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="mh"><b id="mt">＋ 教材を追加</b><button id="mx" class="ghost" aria-label="閉じる">✕</button></div>
    <input id="nn" placeholder="教材名（例: 日本史）" maxlength="30">
    <input id="np" placeholder="各部の問題数（例: 20,20,15）" style="margin-top:8px">
    <p class="mu" style="margin:8px 0 0">第1部から順に入力します。部ごとに1から始まる教材は問題数（例: 8,4,6）、問題番号が全部通しの教材は範囲（例: 1-8,9-20,21-35）で入力します。</p>
    <p class="mu" id="amsg" style="min-height:20px;margin:6px 0 0"></p>
    <button id="nadd" class="pri w">追加して切り替える</button>
  </div>
</div>
<div id="hdl" hidden>
  <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="ht">
    <div class="mh"><b id="ht">🕘 計算履歴</b><button id="hx" class="ghost" aria-label="閉じる">✕</button></div>
    <p class="mu" style="margin:0 0 8px">タップすると、その答えを電卓に入れます。</p>
    <div id="hlist" class="hl"></div>
    <button id="hclr" class="ghost w">🗑 履歴を消す</button>
  </div>
</div>
<div id="gdl" hidden>
  <div class="mbox" role="dialog" aria-modal="true" aria-label="予定のおしらせ" style="text-align:center">
    <p class="mu" style="margin:0">📅 予定のおしらせ</p>
    <div id="glist"></div>
    <div class="gbar"><i id="gbar"></i></div>
  </div>
</div>
<div id="rdl" hidden>
  <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="rt">
    <div class="mh"><b id="rt">⚙ ルーレットの設定</b><button id="rx" class="ghost" aria-label="閉じる">✕</button></div>
    <p class="mu" style="margin:0" id="rbk"></p>
    <p class="mu" style="margin:8px 0 0">出題する部をタップで選びます（色が付いた部だけ出題）。</p>
    <div class="sq" id="rsq"></div>
    <details class="rwdetail">
      <summary>🎚 部ごとの出やすさ（0〜100）</summary>
      <p class="mu">0〜100で調整。0は出題なし、50が標準、100は50の2倍の重みです。</p>
      <div id="rweights"></div>
      <p class="mu">「次の1問」は、今の未修問題から最初に1問選ぶ場合の確率です。5問は重複なしで抽選します。設定は教材ごとに自動保存します。</p>
    </details>
    <p class="mu c" id="rsum" style="margin:0"></p>
    <p class="mu c" id="rmsg" style="min-height:20px;margin:4px 0 0"></p>
    <button id="rreset" class="ghost w">↺ デフォルトに戻す（全部の部・出やすさ50）</button>
    <button id="rok" class="pri w">閉じる</button>
  </div>
</div>
<script>
const K='studylog_v2',DP=[19,6,5,36,14,32,50,38,37,53,54,36];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const newBook=(name,parts,st)=>{const b={id:uid(),name:name,parts:parts||DP.slice(),used:[],rated:{},log:[],act:null};if(st)b.st=st;return b};
const BF=['parts','used','rated','log','act'];
function mkS(src){
  const o={books:[newBook('教材1')],cur:'',calc:{hist:[]},plans:[],notes:[]};
  o.cur=o.books[0].id;
  const cb=()=>o.books.find(b=>b.id===o.cur)||o.books[0];
  BF.forEach(f=>Object.defineProperty(o,f,{get(){return cb()[f]},set(v){cb()[f]=v}}));
  if(src&&typeof src==='object')Object.assign(o,src);
  o.books=(Array.isArray(o.books)?o.books:[]).filter(b=>b&&typeof b==='object');
  if(!o.books.length)o.books=[newBook('教材1')];
  if(!Array.isArray(o.plans))o.plans=[];
  if(!Array.isArray(o.notes))o.notes=[];
  o.books.forEach(b=>{
    if(!b.id)b.id=uid();
    b.name=String(b.name||'教材');
    if(!Array.isArray(b.parts)||!b.parts.length)b.parts=DP.slice();
    if(b.st!=null&&!(Array.isArray(b.st)&&b.st.length===b.parts.length&&b.st.every(x=>Number.isInteger(x)&&x>=1)))delete b.st;
    if(!Array.isArray(b.used))b.used=[];
    if(!b.rated||typeof b.rated!=='object')b.rated={};
    if(!Array.isArray(b.log))b.log=[];
    if(b.act===undefined)b.act=null;
  });
  if(!o.books.some(b=>b.id===o.cur))o.cur=o.books[0].id;
  if(!o.calc||typeof o.calc!=='object')o.calc={hist:[]};
  return o;
}
let S=mkS(),tab='roulette',spinning=false,undoArm=false,delArm=null,sId=0,sC='',sR='',sMsg='',sIn=['',''],cE='',cDone=false,cMsg='',cArm=false,bkArm=false,popId='',tt,logF=false,nowFn=()=>new Date(),plN='',plD='',greetD='',gt;
const saveUI=()=>{try{localStorage.setItem('studylog_ui',JSON.stringify({logF:logF,tab:tab,g:greetD}))}catch(e){}};

function parseSpec(v){
  const E1='各部の問題数を、カンマ区切りの数（例: 8,4,6）か、範囲（例: 1-8,9-20）で入力してください';
  const t=String(v).normalize('NFKC').split(/[,、，\s]+/).filter(x=>x);
  if(!t.length)return{err:E1};
  const R=/^(\d+)[-~〜ー–—−‐‑](\d+)$/,rg=t.filter(x=>R.test(x)).length;
  if(!rg){
    const P=t.map(x=>/^\d+$/.test(x)?parseInt(x,10):NaN);
    if(!P.every(x=>x>=1))return{err:E1};
    if(P.some(x=>x>999))return{err:'1つの部は999問までです'};
    return{parts:P,st:null};
  }
  if(rg!==t.length)return{err:'数と範囲を混ぜずに、どちらかにそろえてください（例: 8,4,6 または 1-8,9-20）'};

}

<script>
/* 学習ルーレット：メニューとメモの改善 */
(() => {
  'use strict';
  const style = document.createElement('style');
  style.textContent = `
    #nav { border-bottom:1px solid var(--bd); }

  `;
  document.head.appendChild(style);

  const menu = $('#mn');
  menu.setAttribute('aria-controls', 'drw');
  menu.setAttribute('aria-expanded', String(drOpen));

      .sort((a,b) => Number(!!b.pin)-Number(!!a.pin) || b.ts-a.ts);

    const columns = [[],[]], heights = [0,0];

  function refreshSearch(input) {
    const start = input.selectionStart, end = input.selectionEnd;
    render();
    const replacement = $('#memo-search');
    if (replacement) {
      replacement.focus({preventScroll:true});
      if (start !== null) replacement.setSelectionRange(start,end);
    }

  const pinButton = document.createElement('button');

      return;

    originalCloseNote(fp);

  $('#nt').addEventListener('input', () => {
    noteSaved = false;

  });
  pinButton.addEventListener('click', () => {
    if (!curN) return;
    curN.pin = !curN.pin;
    pinState();
    flushNote();
  });
  render();
})();

  openDrawer = function () { previousOpen(); sync(); };
  closeDrawer = function (fp) {
    const wasOpen = drOpen;
    previousClose(fp);
    sync();
    if (wasOpen) other.focus({preventScroll:true});
  };
  bottom.addEventListener('click', event => {
    const button = event.target.closest('[data-quick]');
    if (!button) return;
    if (spinning) { toast('ルーレットの抽選が終わるまでお待ちください'); return; }
    const target = button.dataset.quick;
    if (target === 'other') openDrawer();
    else if (tab !== target) go(target);
  });
  sync();
})();

</script>
</body>
</html>
