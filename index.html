<script data-study-code>
const K='studylog_v2',DP=[19,6,5,36,14,32,50,38,37,53,54,36];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const newBook=(name,parts,st)=>{const b={id:uid(),name:name,parts:parts||DP.slice(),used:[],rated:{},log:[],act:null};if(st)b.st=st;return b};
const BF=['parts','used','rated','log','act'];
function mkS(src){
  const o={books:[newBook('教材1')],cur:'',calc:{hist:[]},plans:[],notes:[]};
  o.cur=o.books[0].id;
  const cb=()=>o.books.find(b=>b.id===o.cur)||o.books[0];
  BF.forEach(f=>Object.defineProperty(o,f,{get(){return cb()[f]},set(v){cb()[f]=v}}));
  if(src&&typeof src==='object')Object.assign(o,src);
  o.books=(Array.isArray(o.books)?o.books:[]).filter(b=>b&&typeof b==='object');
  if(!o.books.length)o.books=[newBook('教材1')];
  if(!Array.isArray(o.plans))o.plans=[];
  if(!Array.isArray(o.notes))o.notes=[];
  o.books.forEach(b=>{
    if(!b.id)b.id=uid();
    b.name=String(b.name||'教材');
    if(!Array.isArray(b.parts)||!b.parts.length)b.parts=DP.slice();
    if(b.st!=null&&!(Array.isArray(b.st)&&b.st.length===b.parts.length&&b.st.every(x=>Number.isInteger(x)&&x>=1)))delete b.st;
    if(!Array.isArray(b.used))b.used=[];
    if(!b.rated||typeof b.rated!=='object')b.rated={};
    if(!Array.isArray(b.log))b.log=[];
    if(Array.isArray(b.fromStart))b.fromStart=b.parts.map((_,i)=>b.fromStart[i]===true);
    if(b.act===undefined)b.act=null;
    // 旧版で抽選時に既修扱いとなった、まだ記録していない問題だけを戻す。
    if(b.act&&!b.act.rv&&Array.isArray(b.act.nums)){
      const recorded=new Set();
      b.log.forEach(record=>{
        if(record&&!record.mv&&Array.isArray(record.nums))record.nums.forEach(n=>{if(/^[ABCD]$/.test(record.r?.[n]))recorded.add(n)});
      });
      const pending=new Set(b.act.nums.filter(n=>!recorded.has(n)));
      b.used=b.used.filter(n=>!pending.has(n));
    }
  });
  if(!o.books.some(b=>b.id===o.cur))o.cur=o.books[0].id;
  if(!o.calc||typeof o.calc!=='object')o.calc={hist:[]};
  return o;
}
let S=mkS(),tab='roulette',spinning=false,undoArm=false,delArm=null,sId=0,sC='',sR='',sMsg='',sIn=['',''],cE='',cDone=false,cMsg='',cArm=false,bkArm=false,popId='',tt,logF=false,nowFn=()=>new Date(),plN='',plD='',greetD='',gt;
const saveUI=()=>{if(window.__studyLauncherMemo)return;try{localStorage.setItem('studylog_ui',JSON.stringify({logF:logF,tab:tab,g:greetD}))}catch(e){}};
try{const u=JSON.parse(localStorage.getItem('studylog_ui')||'{}');logF=!!u.logF;greetD=typeof u.g==='string'?u.g:'';if(['roulette','rev','calc','class','log','plan','memo','limits','set'].includes(u.tab))tab=u.tab}catch(e){}
try{const j=localStorage.getItem(K);if(j){const d=JSON.parse(j);if(!d.books){try{localStorage.setItem(K+'_pre_multi',j)}catch(e){}}S=mkS(d)}}catch(e){}
let memoBaseText=JSON.stringify(S.notes||[]);
function mergeMemoNotes(base,local,remote){
  const valid=list=>(Array.isArray(list)?list:[]).filter(n=>n&&typeof n.id==='string'&&typeof n.body==='string');
  const before=new Map(valid(base).map(n=>[n.id,n])),mine=new Map(valid(local).map(n=>[n.id,n]));
  const incoming=new Map(valid(remote).map(n=>[n.id,n])),renamed=[];
  for(const [id,n] of before)if(!mine.has(id)){
    const other=incoming.get(id);
    if(other&&other.body!==n.body){const copy={...other,id:uid()};incoming.delete(id);incoming.set(copy.id,copy)}
    else incoming.delete(id);
  }
  for(const [id,n] of mine){
    const previous=before.get(id),other=incoming.get(id);
    if(previous&&JSON.stringify(previous)===JSON.stringify(n))continue;
    if(previous&&other&&n.body!==previous.body&&other.body!==previous.body&&n.body!==other.body){
      const copy={...n,id:uid()};incoming.set(copy.id,copy);renamed.push({from:id,to:copy.id});
    }else incoming.set(id,n);
  }
  return {notes:Array.from(incoming.values()),renamed};
}
const save=()=>{
  const local=S.notes;let output=S;
  try{
    const raw=localStorage.getItem(K),latest=raw?JSON.parse(raw):null;
    if(window.__studyLauncherMemo&&latest&&(!Array.isArray(latest.books)&&!Array.isArray(latest.parts)))return false;
    const base=JSON.parse(memoBaseText),merged=mergeMemoNotes(base,local,latest?latest.notes:[]);
    if(window.__studyLauncherMemo&&latest)output=mkS(latest);
    output.notes=merged.notes;localStorage.setItem(K,JSON.stringify(output));S=output;memoBaseText=JSON.stringify(S.notes);
    try{if(typeof window.__studyMemoAfterSave==='function')window.__studyMemoAfterSave(base,merged.renamed)}catch(_){}
    return true;
  }catch(e){if(output===S)S.notes=local;return false}
};
if(window.__studyLauncherMemo)tab='memo';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const selA=()=>{const b=curBook(),n=b.parts.length;const s=Array.isArray(b.sel)?[...new Set(b.sel)].filter(x=>Number.isInteger(x)&&x>=1&&x<=n).sort((x,y)=>x-y):null;return s&&s.length&&s.length<n?s:null};
const pool=all=>{const u=new Set(S.used),a=[],sel=all?null:selA();S.parts.forEach((c,i)=>{if(sel&&!sel.includes(i+1))return;for(let q=1;q<=c;q++){const id=(i+1)*1000+q;if(!u.has(id))a.push(id)}});return a};
function rng(a){const o=[];let i=0;while(i<a.length){let j=i;while(j+1<a.length&&a[j+1]===a[j]+1)j++;o.push(j-i>=2?a[i]+'〜'+a[j]:a.slice(i,j+1).join('・'));i=j+1}return o.join('・')}
// 出やすさは1問ごとの相対的な重み。既存教材は50が標準。
function partWeight(part,b=curBook()){
  const value=Array.isArray(b.weights)?b.weights[part-1]:undefined;
  return typeof value==='number'&&Number.isFinite(value)?Math.max(0,Math.min(100,Math.round(value))):50;
}
const partFromStart=(part,b=curBook())=>Array.isArray(b.fromStart)&&b.fromStart[part-1]===true;
const drawPool=()=>pool().filter(id=>partWeight(Math.floor(id/1000))>0);
function pickProblems(source,review){
  const remaining=source.slice(),picked=[];
  while(picked.length<5&&remaining.length){
    const weights=remaining.map(id=>review?1:partWeight(Math.floor(id/1000)));
    const sum=weights.reduce((a,b)=>a+b,0);
    if(sum<=0)break;
    let ticket=Math.random()*sum,index=-1;
    for(let i=0;i<weights.length;i++){
      if(weights[i]<=0)continue;
      index=i;ticket-=weights[i];
      if(ticket<0)break;
    }
    if(index<0)break;
    if(!review&&partFromStart(Math.floor(remaining[index]/1000))){
      const part=Math.floor(remaining[index]/1000);let first=index;
      for(let i=0;i<remaining.length;i++)if(Math.floor(remaining[i]/1000)===part&&remaining[i]<remaining[first])first=i;
      index=first;
    }
    picked.push(remaining.splice(index,1)[0]);
  }
  return picked.sort((a,b)=>a-b);
}
const total=()=>S.parts.reduce((t,c)=>t+c,0);
const stA=()=>{const b=curBook();return Array.isArray(b.st)&&b.st.length===b.parts.length&&b.st.every(x=>Number.isInteger(x)&&x>=1)?b.st:null};
const num=id=>{const st=stA(),q=id%1000;return st?st[Math.floor(id/1000)-1]+q-1:q};
const lab=id=>stA()?`第${Math.floor(id/1000)}部 ${num(id)}番`:`第${Math.floor(id/1000)}部 ${id%1000}問目`,sh=id=>stA()?String(num(id)):Math.floor(id/1000)+'-'+id%1000;
const notation=()=>stA()?'通し番号':'部-問';
const specStr=b=>Array.isArray(b.st)&&b.st.length===b.parts.length?b.parts.map((c,i)=>b.st[i]+'-'+(b.st[i]+c-1)).join(','):b.parts.join(',');
function parseSpec(v){
  const E1='各部の問題数を、カンマ区切りの数（例: 8,4,6）か、範囲（例: 1-8,9-20）で入力してください';
  const t=String(v).normalize('NFKC').split(/[,、，\s]+/).filter(x=>x);
  if(!t.length)return{err:E1};
  const R=/^(\d+)[-~〜ー–—−‐‑](\d+)$/,rg=t.filter(x=>R.test(x)).length;
  if(!rg){
    const P=t.map(x=>/^\d+$/.test(x)?parseInt(x,10):NaN);
    if(!P.every(x=>x>=1))return{err:E1};
    if(P.some(x=>x>999))return{err:'1つの部は999問までです'};
    return{parts:P,st:null};
  }
  if(rg!==t.length)return{err:'数と範囲を混ぜずに、どちらかにそろえてください（例: 8,4,6 または 1-8,9-20）'};
  const parts=[],st=[];let prev=0;
  for(const x of t){
    const m=R.exec(x),a=+m[1],b=+m[2];
    if(a<1||b<a)return{err:'範囲は「小さい番号-大きい番号」で入力してください（例: 1-8）'};
    if(a<=prev)return{err:'範囲は小さい番号から順に、重ならないように入力してください'};
    if(b-a+1>999)return{err:'1つの部は999問までです'};
    st.push(a);parts.push(b-a+1);prev=b;
  }
  return{parts:parts,st:st};
}
const fmt=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const el=()=>S.act?S.act.ms+(S.act.t0?Date.now()-S.act.t0:0):0;
const cdList=()=>Object.keys(S.rated).map(Number).filter(n=>S.rated[n]==='C'||S.rated[n]==='D').sort((x,y)=>x-y);
const chip=(n,g,d)=>`<span class="chip c${g}"${d?` data-id="${n}"`:''}>${sh(n)}${g?' '+g:''}</span>`;

function setupForm(t){
  return `<div class="card"><label>${t}</label><input id="tot" value="${esc(specStr(curBook()))}"><p class="mu">問題数：8,4,6 ／ 範囲：1-8,9-20<br>${S.parts.length}部・${total()}問</p><button id="stot" class="pri w">保存</button><p class="mu" id="smsg"></p></div>`;
}
function vRoulette(){
  const pa=pool(1),p=drawPool(),T=total(),done=T-pa.length,sel=selA();
  let h=`<div class="card"><div class="row"><span>未修 <b>${pa.length}</b> / ${T} 問</span><span class="row"><span class="mu">${Math.round(done/T*100)}% 完了</span><button class="rg${sel?' on':''}" id="rcfg" aria-label="ルーレットの設定">⚙</button></span></div><div class="bar"><i style="width:${done/T*100}%"></i></div>${sel?`<p class="mu" style="margin:8px 0 0">🎛 出題対象: 第${rng(sel)}部（残り ${p.length}問）</p>`:''}</div>`;
  if(S.act)return h+(S.act.rv?'<div class="card c mu">📚 復習中です。「復習」タブで続けてください</div>':vSession())+vOne();
  h+=`<div class="slots">${'<div class="slot">?</div>'.repeat(5)}</div><button class="big" id="spin" ${p.length?'':'disabled'}>🎯 ルーレットを回す</button>`;
  if(!p.length)h+=!pa.length?'<p class="c mu">全問題を一巡しました 🎉</p>':pool().length?'<p class="c mu">出やすさがすべて0です</p>':'<p class="c mu">選択中の部は完了しました</p>';
  return h+vOne();
}
function vRev(){
  if(S.act)return S.act.rv?vSession():'<div class="card c mu">🎯 ルーレット中です。完了してから復習できます</div>';
  const cd=cdList(),nd=cd.filter(n=>S.rated[n]==='D').length;
  return `<div class="card"><label>📚 復習</label><p class="mu">D ${nd}問 ／ C ${cd.length-nd}問</p></div><div class="slots">${'<div class="slot">?</div>'.repeat(5)}</div><button class="big" id="rv" ${cd.length?'':'disabled'}>📚 復習ルーレットを回す</button>${cd.length?'':'<p class="c mu">C・Dなし</p>'}`;
}
function vSession(){

function getBookEstimate(book,now=nowFn()){
  const parts=book.parts.map(count=>Number.isInteger(count)&&count>0?count:0);
  const total=parts.reduce((sum,count)=>sum+count,0),completed=new Set();
  const today=dayN(now.getFullYear(),now.getMonth()+1,now.getDate());
  let count3=0,count7=0;const daily={};
  for(const record of book.log){
    if(!record||record.mv||!Array.isArray(record.nums))continue;
    const timestamp=Number(record.ts);
    if(!Number.isFinite(timestamp)||timestamp>now.getTime())continue;
    const date=new Date(timestamp),day=dayN(date.getFullYear(),date.getMonth()+1,date.getDate());
    if(!Number.isFinite(day))continue;
    const numbers=[...new Set(record.nums)].filter(id=>{
      if(!Number.isInteger(id))return false;
      const part=Math.floor(id/1000),question=id%1000;
      return part>=1&&part<=parts.length&&question>=1&&question<=parts[part-1]&&/^[ABCD]$/.test(record.r?.[id]);
    });
    numbers.forEach(id=>completed.add(id));
    if(day>=today-2&&day<=today){count3+=numbers.length;daily[day]=(daily[day]||0)+numbers.length}
    if(day>=today-6&&day<=today)count7+=numbers.length;
  }
  const remaining=Math.max(0,total-completed.size);
  const window=days=>{
    const count=days===3?count3:count7;
    return {count,average:count/days,days:remaining===0?0:count?Math.ceil(remaining*days/count):null};
  };
  return {total,completed:completed.size,remaining,daily,three:window(3),seven:window(7)};
}

  function clearMemoDrag() {
    const d = memoDrag;
    if (!d) return null;
    clearTimeout(d.timer);
    cancelAnimationFrame(d.frame);
    if (d.ghost) d.ghost.remove();
    d.card.classList.remove('memo-placeholder');
    d.card.removeAttribute('aria-grabbed');
    document.body.classList.remove('memo-dragging');
    trash.hidden = true;
    trash.classList.remove('over');
    memoDrag = null;
    return d;
  }
  function cancelMemoDrag(redraw=true) {
    const d = clearMemoDrag();
    if (d && d.active) {
      blockMemoClick(d);
      if (redraw) render();
    }
  }
  function blockMemoClick(d) {
    blockPoint = {x:d.x,y:d.y};
    blockClickUntil = Date.now()+450;
  }
  function pointFor(e,d,ending=false) {
    if (!d.touch) return e;
    return Array.from(ending?e.changedTouches:e.touches).find(p=>p.identifier===d.touchId);
  }
  function memoStart(e) {
    const touch = e.type==='touchstart';
    if (touch) ignoreMouseUntil = Date.now()+900;
    if (!touch && (e.button!==0 || Date.now()<ignoreMouseUntil)) return;
    if (touch && e.touches.length!==1) { cancelMemoDrag(); return; }
    const card = e.target.closest('.memo-grid .nc[data-nid]');
    if (!card || tab!=='memo' || curN || drOpen) return;
    cancelMemoDrag();
    const p = touch ? e.touches[0] : e;
    memoDrag = {id:card.dataset.nid,card,grid:card.parentElement,touch,touchId:p.identifier,x:p.clientX,y:p.clientY,startX:p.clientX,startY:p.clientY,active:false,pinGroup:card.dataset.pin};
    memoDrag.timer = setTimeout(beginMemoDrag,380);
  }
  function beginMemoDrag() {
    const d = memoDrag;
    if (!d || tab!=='memo' || !d.card.isConnected) return cancelMemoDrag(false);
    const r = d.card.getBoundingClientRect();
    d.active = true;
    d.ids = Array.from(d.grid.children,c=>c.dataset.nid);
    d.dx = d.x-r.left;
    d.dy = d.y-r.top;
    d.ghost = d.card.cloneNode(true);
    d.ghost.removeAttribute('data-nid');
    d.ghost.removeAttribute('data-pin');
    d.ghost.setAttribute('aria-hidden','true');
    d.ghost.tabIndex = -1;
    d.ghost.classList.add('memo-drag-ghost');
    d.ghost.style.width = r.width+'px';
    document.body.appendChild(d.ghost);
    d.card.classList.add('memo-placeholder');
    d.card.setAttribute('aria-grabbed','true');
    document.body.classList.add('memo-dragging');
    trash.hidden = false;
    swBlock = true;
    try { if (navigator.vibrate) navigator.vibrate(20); } catch (_) {}
    positionMemoDrag();
    d.frame = requestAnimationFrame(scrollMemoDrag);
  }
  function positionMemoDrag() {
    const d = memoDrag;
    if (!d || !d.active) return;
    d.ghost.style.left = (d.x-d.dx)+'px';
    d.ghost.style.top = (d.y-d.dy-5)+'px';
    d.overTrash = inside(trash.getBoundingClientRect(),d.x,d.y);
    trash.classList.toggle('over',d.overTrash);
    const trashText = d.overTrash?'🗑 離すと削除':'🗑 ここに離して削除';
    if (trash.textContent!==trashText) trash.textContent = trashText;
    if (d.overTrash || !inside(d.grid.getBoundingClientRect(),d.x,d.y,24)) return;
    if (inside(d.card.getBoundingClientRect(),d.x,d.y,3)) return;
    const cards = Array.from(d.grid.children);
    // ピン留めを先頭に保ち、並べ替えでは固定状態を変更しない。
    const hit = cards.find(card=>inside(card.getBoundingClientRect(),d.x,d.y));
    if (hit && hit.dataset.pin!==d.pinGroup) return;
    let target = null, distance = Infinity;
    cards.forEach(card=>{
      if (card===d.card || card.dataset.pin!==d.pinGroup) return;
      const r = card.getBoundingClientRect();
      const dx = Math.max(r.left-d.x,0,d.x-r.right), dy = Math.max(r.top-d.y,0,d.y-r.bottom);
      const dist = dx*dx+dy*dy;
      if (dist<distance) { target=card; distance=dist; }
    });
    if (!target) return;
    const from = cards.indexOf(d.card), to = cards.indexOf(target);
    d.grid.insertBefore(d.card,to>from?target.nextSibling:target);
  }
  function scrollMemoDrag(time) {
    const d = memoDrag;
    if (!d || !d.active) return;
    const dt = d.lastFrame ? Math.min(32,time-d.lastFrame)/16.7 : 1;
    d.lastFrame = time;
    const nav = $('#nav'), bottom = $('#quick-nav');
    const topEdge = (nav?nav.getBoundingClientRect().bottom:0)+48;
    const bottomEdge = window.innerHeight-(bottom?bottom.getBoundingClientRect().height:76)-58;
    let speed = 0;
    if (!d.overTrash) {
      if (d.y<topEdge) speed = -Math.min(16,(topEdge-d.y)*.25);
      else if (d.y>bottomEdge) speed = Math.min(16,(d.y-bottomEdge)*.25);
    }
    if (speed) window.scrollBy(0,speed*dt);
    positionMemoDrag();
    d.frame = requestAnimationFrame(scrollMemoDrag);
  }
  function memoMove(e) {
    const d = memoDrag;
    if (!d || (e.type==='touchmove')!==d.touch) return;
    if (d.touch && e.touches.length!==1) { cancelMemoDrag(); return; }
    const p = pointFor(e,d);
    if (!p) return;
    d.x = p.clientX;
    d.y = p.clientY;
    if (!d.active) {
      if (Math.hypot(d.x-d.startX,d.y-d.startY)>10) cancelMemoDrag(false);
      return;
    }
    if (e.cancelable) e.preventDefault();
    positionMemoDrag();
  }
  function memoEnd(e) {
    const d = memoDrag;
    if (!d || (e.type==='touchend')!==d.touch) return;
    const p = pointFor(e,d,true);
    if (!p) return;
    if (!d.active) { clearMemoDrag(); return; }
    if (e.cancelable) e.preventDefault();
    d.x = p.clientX;
    d.y = p.clientY;
    positionMemoDrag();
    const overTrash = d.overTrash;
    const inGrid = inside(d.grid.getBoundingClientRect(),d.x,d.y,24);
    const ids = Array.from(d.grid.children,c=>c.dataset.nid);
    blockMemoClick(d);
    clearMemoDrag();
    if (overTrash) trashMemo(d.id);
    else if (inGrid && d.ids.some((id,i)=>id!==ids[i])) {
      if (commitMemoOrder(ids,d.id)) toast('並び順を保存しました');
    }
    render();
  }
  const app = $('#app');
  app.addEventListener('touchstart',memoStart,{passive:true});
  app.addEventListener('mousedown',memoStart);
  document.addEventListener('touchmove',memoMove,{passive:false});
  document.addEventListener('mousemove',memoMove);
  document.addEventListener('touchend',memoEnd,{passive:false});
  document.addEventListener('mouseup',memoEnd);
  document.addEventListener('touchcancel',()=>cancelMemoDrag());
  document.addEventListener('touchstart',e=>{if(e.touches.length>1)cancelMemoDrag()},{passive:true});
  document.addEventListener('click',e=>{
    const blocked = memoDrag && memoDrag.active || blockPoint && Date.now()<blockClickUntil && Math.hypot(e.clientX-blockPoint.x,e.clientY-blockPoint.y)<32;
    if (!blocked || !e.target.closest('.nc[data-nid]')) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    blockClickUntil = 0;
  },true);
  app.addEventListener('contextmenu',e=>{if(e.target.closest('.nc[data-nid]'))e.preventDefault()});
  app.addEventListener('dragstart',e=>{if(e.target.closest('.nc[data-nid]'))e.preventDefault()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')cancelMemoDrag()});
  window.addEventListener('blur',()=>cancelMemoDrag());
  window.addEventListener('scroll',()=>{if(memoDrag && !memoDrag.active)cancelMemoDrag(false)},{passive:true});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelMemoDrag()});
  const beforeMemoRender = render;
  render = function () { cancelMemoDrag(false); beforeMemoRender(); };

  const pinButton = document.createElement('button');
  pinButton.id = 'npin';
  pinButton.className = 'ghost';
  $('#ndel').before(pinButton);
  const footer = document.createElement('div');
  footer.className = 'note-foot';
  footer.setAttribute('role', 'status');
  footer.setAttribute('aria-live', 'polite');
  $('#nt').after(footer);
  $('#nb').textContent = '← 保存して戻る';
  let noteSaved = true;
  function status(message, error=false) {
    footer.textContent = message;
    footer.dataset.error = String(error);
  }
  function pinState() {
    const pinned = !!(curN && curN.pin);
    pinButton.textContent = pinned ? '📌 固定中' : '📌 固定';
    pinButton.setAttribute('aria-pressed', String(pinned));
    pinButton.setAttribute('aria-label', pinned ? 'ピン留めを解除' : 'メモをピン留め');
  }
  function checkSaved() {
    try { return localStorage.getItem(K) === JSON.stringify(S); }
    catch (_) { return false; }
  }
  const originalFlushNote = flushNote;
  flushNote = function () {
    if (!curN) return;
    originalFlushNote();
    noteSaved = checkSaved();
    if (!noteSaved) {
      status('保存できませんでした',true);
      return;
    }
    if(!curN)return;
    const now = nowFn();
    $('#nd').textContent = memoDate(curN.ts)+' 更新';
    status(noteDraftBody().trim() ? '保存済み '+pad2(now.getHours())+':'+pad2(now.getMinutes()) : '');
  };
  const originalOpenNote = openNote;
  openNote = function (id) {
    originalOpenNote(id);
    if(!curN)return;
    noteSaved = true;
    pinState();
    status(curN.body.trim() ? '保存済み' : '');
  };
  const originalCloseNote = closeNote;
  closeNote = function (fp) {
    if (!curN) return;
    flushNote();
    if (!noteSaved) {
      // Androidの戻る操作でも、保存に失敗した本文を残す。
      if (fp) pushOv();
      return;
    }
    originalCloseNote(fp);
  };
  for(const id of ['note-title','nt'])$('#'+id).addEventListener('input', () => {
    noteSaved = false;
    status('保存中…');
  });
  pinButton.addEventListener('click', () => {
    if (!curN) return;
    curN.pin = !curN.pin;
    curN.order = Math.min(0,...notesArr().map(noteRank))-1;
    pinState();
    flushNote();
  });
  render();
})();

</script>
<script data-study-code>
/* よく使う機能への下部メニュー */
(() => {
  const quickTabs = TABS.slice(0,-1);
  const css = document.createElement('style');
  css.textContent = `
    #nav #mn { display:none; }
    main { padding-bottom:calc(112px + env(safe-area-inset-bottom,0px)); }
    #quick-nav {
      position:fixed; top:auto; bottom:0; left:50%; right:auto;
      transform:translateX(-50%); z-index:70; width:100%; max-width:560px;
      display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:4px;

    #toast { bottom:calc(96px + env(safe-area-inset-bottom,0px)); }
  `;
  document.head.appendChild(css);
  const bottom = document.createElement('nav');
  bottom.id = 'quick-nav';
  bottom.setAttribute('aria-label', 'よく使う機能');
  bottom.innerHTML = `
    <button type="button" data-quick="roulette"><span aria-hidden="true">🎯</span>ルーレット</button>
    <button type="button" data-quick="calc"><span aria-hidden="true">🧮</span>電卓</button>
    <button type="button" data-quick="log"><span aria-hidden="true">📖</span>記録</button>
    <button type="button" data-quick="other" aria-controls="drw" aria-expanded="false"><span aria-hidden="true">☰</span>その他</button>
  `;
  document.body.appendChild(bottom);
  const other = bottom.querySelector('[data-quick="other"]');
  function sync() {
    bottom.querySelectorAll('[data-quick]').forEach(button => {
      const key = button.dataset.quick;
      const selected = key === 'other' ? !quickTabs.includes(tab) : key === tab;
      button.classList.toggle('on', selected);
      if (key !== 'other' && selected) button.setAttribute('aria-current', 'page');
      else button.removeAttribute('aria-current');
    });
    other.setAttribute('aria-expanded', String(drOpen));
  }
  const previousRender = render;
  render = function () { previousRender(); sync(); };
  const previousOpen = openDrawer, previousClose = closeDrawer;
  openDrawer = function () { previousOpen(); sync(); };
  closeDrawer = function (fp) {
    const wasOpen = drOpen;
    previousClose(fp);
    sync();
    if (wasOpen) other.focus({preventScroll:true});
  };
  bottom.addEventListener('click', event => {
    const button = event.target.closest('[data-quick]');
    if (!button) return;
    if (spinning) { toast('ルーレットの抽選が終わるまでお待ちください'); return; }
    const target = button.dataset.quick;
    if (target === 'other') openDrawer();
    else if (tab !== target) go(target);
  });
  sync();
})();

</script>
<script data-study-code>
/* HTMLの更新通知：同じコードでは一度だけ。学習データには触れません。 */
(() => {
  'use strict';
  const key = 'studylog_html_notice_v1';
  const source = Array.from(document.querySelectorAll('[data-study-code]'))
    .map(element => element.textContent).join('\n');
  let a = 2166136261, b = 5381;
  for (let i = 0; i < source.length; i++) {
    a = Math.imul(a ^ source.charCodeAt(i), 16777619);
    b = Math.imul(b, 33) ^ source.charCodeAt(i);
  }
  const version = (a >>> 0).toString(16) + ':' + (b >>> 0).toString(16) + ':' + source.length;
  let previous, existing;
  try {
    previous = localStorage.getItem(key);
    existing = localStorage.getItem('studylog_v2') !== null || localStorage.getItem('studylog_ui') !== null;
  } catch (_) { return; }
  if (previous === version) return;
  let finished = false;
  function showWhenReady() {
    if (finished || document.hidden || document.readyState === 'loading') return;
    const app = document.getElementById('app');
    if (!app || !app.children.length) return;
    try { localStorage.setItem(key, version); }
    catch (_) { return; }
    finished = true;
    document.removeEventListener('visibilitychange', showWhenReady);
    if (previous === null && !existing) return;
    const notice = document.createElement('div');
    notice.id = 'study-update-notice';
    notice.setAttribute('role', 'status');
    notice.setAttribute('aria-live', 'polite');
    notice.textContent = 'アップデートしました';
    document.body.appendChild(notice);
    setTimeout(() => notice.remove(), 2000);
  }
  document.addEventListener('visibilitychange', showWhenReady);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', showWhenReady, {once:true});
  else showWhenReady();
})();

</script>
<script data-study-code>
/* The launcher page and the study screen use the same note IDs and storage. */
(() => {
  function bindEditor(base,renamed=[]){
    if(!curN)return;
    if(noteDraftChanged())return;
    const change=renamed.find(x=>x.from===curN.id),id=change?change.to:curN.id;
    const note=notesArr().find(n=>n.id===id);
    if(note){
      curN=note;setNoteDraft(note);
      $('#nd').textContent=memoDate(note.ts)+' 更新';
      const pin=$('#npin');if(pin){pin.textContent=note.pin?'📌 固定中':'📌 固定';pin.setAttribute('aria-pressed',String(!!note.pin));pin.setAttribute('aria-label',note.pin?'ピン留めを解除':'メモをピン留め');}
    }else if(base.some(n=>n.id===id)){
      clearTimeout(nT);curN=null;$('#ndl').hidden=true;document.body.style.overflow='';nArm=false;
      popOv();render();
    }
  }
  window.__studyMemoAfterSave=bindEditor;
  window.__studySyncMemo=function(){
    if(JSON.stringify(S.notes||[])!==memoBaseText)return;
    if(noteDraftChanged())return;
    try{
      const raw=localStorage.getItem(K);if(!raw)return;const latest=JSON.parse(raw);
      if(!latest||!Array.isArray(latest.notes))return;
      const base=JSON.parse(memoBaseText),notes=latest.notes,changed=JSON.stringify(notes)!==memoBaseText;
      if(window.__studyLauncherMemo)S=mkS(latest);else S.notes=notes;
      memoBaseText=JSON.stringify(S.notes);bindEditor(base);
      if(tab==='memo'&&changed){
        const input=document.activeElement,search=input?.id==='memo-search',start=search?input.selectionStart:null,end=search?input.selectionEnd:null;
        render();if(search){const next=$('#memo-search');next.focus({preventScroll:true});if(start!==null)next.setSelectionRange(start,end);}
      }
    }catch(_){}
  };
  window.addEventListener('storage',e=>{if(e.key===K)window.__studySyncMemo()});
  window.addEventListener('study-native-resume',window.__studySyncMemo);
  window.addEventListener('focus',window.__studySyncMemo);
  if(!window.__studyLauncherMemo)return;
  const css=document.createElement('style');css.textContent=`
    #quick-nav,#drw,#nav #mn{display:none!important}
    main{padding-bottom:80px!important}
    .fab{bottom:20px!important}
    #memo-trash{bottom:18px!important}
  `;document.head.appendChild(css);
  let swipeState;
  function gesture(){
    const editing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||'');
    const enabled=!curN&&!editing&&!document.body.classList.contains('memo-dragging');
    if(enabled===swipeState)return;swipeState=enabled;
    try{AndroidApp.launcherMemoCanSwipe(enabled)}catch(_){}
  }
  new MutationObserver(gesture).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['hidden','class']});
  document.addEventListener('focusin',gesture);document.addEventListener('focusout',()=>setTimeout(gesture,0));
  window.__studyLauncherMemoEnter=function(){window.__studySyncMemo();if(tab!=='memo')go('memo');gesture()};
  window.__studyLauncherMemoLeave=function(){
    flushNote();document.activeElement?.blur();window.dispatchEvent(new Event('blur'));
    if(!curN)window.__studyNativeTouched=false;
  };
  window.__studyLauncherMemoEnter();
})();
</script>
